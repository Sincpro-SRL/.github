name: Publish release

on:
  release:
    types: [published]

  workflow_call:
    inputs:
      environments:
        description: 'JSON array of string values to iterate (e.g., ''["pypi", "gemfury"]'' or ''["npm", "docker"]''). Each string becomes matrix.env and is passed to prepare-env as environment.'
        required: false
        type: string
        default: '["default"]'
      runs_on:
        description: 'JSON string, e.g. "ubuntu-24.04"'
        required: false
        type: string
        default: '"ubuntu-24.04"'
      container:
        description: 'Optional job container as JSON: an image string (''"ghcr.io/catthehacker/ubuntu:act-24.04"'') or a container object (''{"image":"ghcr.io/catthehacker/ubuntu:act-24.04"}''). The image must provide git, make, curl and jq (see README). Leave empty to run directly on the runner. Required by ARC runners in kubernetes mode.'
        required: false
        type: string
        default: ""

env:
  GEMFURY_PUSH_TOKEN: ${{ secrets.GEMFURY_PUSH_TOKEN }}
  POETRY_PYPI_TOKEN: ${{ secrets.POETRY_PYPI_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish_package:
    name: Release Process (${{ matrix.env }})
    runs-on: ${{ inputs.runs_on && fromJSON(inputs.runs_on) || 'ubuntu-24.04' }}
    container: ${{ inputs.container && fromJSON(inputs.container) || '' }}

    strategy:
      fail-fast: false
      matrix:
        env: ${{ inputs.environments && fromJSON(inputs.environments) || fromJSON('["CI/CD"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare environment
        uses: ./.github/actions/prepare-env
        with:
          environment: ${{ matrix.env }}

      - name: Initialize dependencies
        run: make init

      - name: Build and Publish package
        run: |
          make publish
