name: Check code style

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main

  workflow_call:
    inputs:
      environments:
        description: 'JSON array of string values to iterate (e.g., ''["dev", "staging", "prod"]'' or ''["python-3.11", "python-3.12"]''). Each string becomes matrix.env and is passed to prepare-env as environment.'
        required: false
        type: string
        default: '["default"]'
      runs_on:
        description: 'Target runner. Must be valid JSON, quotes included — a plain label (''"ubuntu-24.04"'') or a JSON array of labels (''["self-hosted", "ci-runner"]'') for self-hosted runners. Passing an unquoted value like ''self-hosted'' will fail.'
        required: false
        type: string
        default: '"ubuntu-24.04"'

env:
  GEMFURY_PUSH_TOKEN: ${{ secrets.GEMFURY_PUSH_TOKEN }}
  POETRY_PYPI_TOKEN: ${{ secrets.POETRY_PYPI_TOKEN }}

jobs:
  checks:
    name: Check code (${{ matrix.env }})
    runs-on: ${{ inputs.runs_on && fromJSON(inputs.runs_on) || 'ubuntu-24.04' }}

    strategy:
      fail-fast: false
      matrix:
        env: ${{ inputs.environments && fromJSON(inputs.environments) || fromJSON('["CI/CD"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment
        uses: ./.github/actions/prepare-env
        with:
          environment: ${{ matrix.env }}

      - name: Initialize dependencies
        run: make init

      - name: Verify code format
        run: make verify-format

      - name: Test
        run: make test
