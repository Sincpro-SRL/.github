name: "Environment Preparation"
description: "Prepares environment based on any configuration value"

inputs:
  environment:
    description: "Environment string (e.g., 'default', 'python-3.11', 'dev', 'staging')"
    required: false
    default: "default"

runs:
  using: "composite"
  steps:
    - name: Parse and setup environment
      shell: bash
      run: |
        ENV="${{ inputs.environment }}"
        echo "🎯 Environment: ${ENV}"
        echo "🔧 Using environment: ${ENV}"

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Install core Python tools
      shell: bash
      run: |
        echo "Installing Python core tools..."
        python -m pip install --upgrade pip
        pip install yamllint

    - name: Install core Node tools
      shell: bash
      run: |
        echo "Installing Node core tools..."
        npm install -g prettier

    - name: Verify installation
      shell: bash
      run: |
        echo "Verification complete with environment: ${{ inputs.environment }}"
        echo "✓ Python: $(python --version)"
        echo "✓ pip: $(pip --version)"
        echo "✓ Node: $(node --version)"
        echo "✓ npm: $(npm --version)"
        echo "✓ prettier: $(prettier --version)"
        echo "✓ yamllint: $(yamllint --version)"
